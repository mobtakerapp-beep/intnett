<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مهمة أصدقاء الأمان الرقمي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eaf6ff;--card:#fff;--text:#1d2a5b;--acc:#6a4fd8;--acc2:#18b7d9;--ok:#1f9d63;--okbg:#e4f8ee;--no:#c2410c;--nobg:#fff1e6;--line:#c9d8f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a3a;--card:#1a2756;--text:#eef2ff;--acc:#9b86ff;--acc2:#4fd3ee;--ok:#5be0a0;--okbg:#12382c;--no:#ffb27a;--nobg:#3d2a1a;--line:#34447f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a3a;--card:#1a2756;--text:#eef2ff;--acc:#9b86ff;--acc2:#4fd3ee;--ok:#5be0a0;--okbg:#12382c;--no:#ffb27a;--nobg:#3d2a1a;--line:#34447f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7;min-height:100%}
.w{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 24px rgba(60,80,170,.18)}
.card img.h{display:block;width:100%;height:auto}
.b{padding:16px 18px 20px}
h1{font-size:1.65rem;margin:.2em 0;line-height:1.4}h2{font-size:1.2rem;margin:0 0 6px}
p{margin:.4em 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;margin-top:12px}
.btn:focus-visible,.o:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.o{display:block;width:100%;text-align:right;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:13px 15px;font:inherit;font-size:1.05rem;margin-top:10px;cursor:pointer}
.o.good{border-color:var(--ok);background:var(--okbg)}.o.bad{border-color:var(--no);background:var(--nobg)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.seg{display:flex;gap:5px;flex:1}.seg i{flex:1;height:12px;border-radius:8px;background:var(--line);transition:.4s}
.seg i.on{background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--acc2)}
.st{font-weight:800;white-space:nowrap}
.fb{margin-top:14px;padding:13px 14px;border-radius:18px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb b{display:block;margin-bottom:2px}
.sl{font-size:.95rem;opacity:.85}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.seg i{transition:none}}
.fin{position:relative;aspect-ratio:2/3;background:center/cover no-repeat;border-radius:24px;overflow:hidden;box-shadow:0 6px 24px rgba(60,80,170,.25)}
.fin .n{position:absolute;top:18.5%;left:50%;transform:translateX(-50%);text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 8px rgba(20,30,120,.6);width:40%}
.fin .n big{display:block;font-size:min(14vw,4.5rem);line-height:1.1}
.fin .t{position:absolute;left:8%;right:8%;top:76%;bottom:6%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#1d2a5b;line-height:1.5}
.fin .t h1{font-size:min(6.2vw,1.9rem);color:#4a33b8;margin:0}.fin .t p{margin:.2em 0;font-size:min(3.9vw,1.05rem);font-weight:600}
.cr{max-width:520px;margin:6px auto 0;padding:10px 14px 24px;text-align:center;font-size:.95rem}.cr div{display:none}.cr p{margin:.5em 0}.cr b{font-size:1.1rem;color:var(--acc)}</style></head><body><div class="w" id="app"></div><footer class="cr"><div>إشراف</div><p>الأخصائية الاجتماعية<br><b>أحلام الصواعي</b></p><p>مديرة المدرسة<br><b>أشيخة المطاعني</b></p></footer>

const A=document.getElementById('app');let i=0,stars=0,ac;
function snd(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sh(a){a=a.map((x,k)=>[x,k]);for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){i=0;stars=0;A.innerHTML=`<div class="card"><img class="h" alt="" src="${IM[1]}"><div class="b"><h1>🎮 مهمة أصدقاء الأمان الرقمي</h1><p><b>اختبر قرارك.. واحمِ عالمك الرقمي!</b></p><p>مرحبًا بك أيها الصديق! عالمنا الرقمي يحتاج إلى مساعدتك. أمامك سبع مهمات، وفي كل مهمة ستواجه موقفًا، وعليك اختيار التصرف الصحيح حتى تحصل على نجمة الأمان.</p><button class="btn" id="go">ابدأ المهمة</button></div></div>`;document.getElementById('go').onclick=()=>{snd(660,.15);show()}}
function bar(){return `<div class="top"><div class="seg" aria-label="درع الحماية">${S.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div><div class="st">⭐ ${stars}</div></div>`}
function show(){const s=S[i];A.innerHTML=bar()+`<div class="card"><img class="h" alt="" src="${IM[s.im]}"><div class="b"><h2>${s.t}</h2><p><b>الموقف:</b> ${s.q}</p><div id="os"></div><div id="fb"></div></div></div>`;
const os=document.getElementById('os');sh(s.o).forEach(([t,k])=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=()=>pick(b,k===s.c);os.appendChild(b)})}
function pick(b,ok){const s=S[i];const all=[...document.querySelectorAll('.o')];all.forEach(x=>x.disabled=true);
if(ok){stars++;b.classList.add('good','pop');snd(880,.25)}else{b.classList.add('bad');all.find(x=>x.textContent===s.o[s.c]).classList.add('good');snd(300,.3)}
const last=i===S.length-1;
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><span class="sl">🛡️ صديق الأمان الرقمي</span><b>${ok?'أحسنت! حصلت على نجمة أمان ⭐':'لا بأس يا صديقي، المحاولة جزء من التعلّم! 💪'}</b>${s.e}</div><button class="btn" id="nx">${last?'اعرض النتيجة':'المحطة التالية'}</button>`;
document.querySelector('.seg').children[i].classList.add('on');
document.getElementById('nx').onclick=()=>{i++;i>=S.length?end():show()};document.getElementById('nx').focus()}
function end(){snd(784,.2);setTimeout(()=>snd(988,.3),200);
A.innerHTML=`<div class="fin" style="background-image:url(${IM[8]})"><div class="n pop"><big>⭐ ${stars}/7</big></div><div class="t"><h1>أحسنت يا بطل!</h1><p>لقد نجحت في حماية عالمك الرقمي، وأصبحت «بطل الأمان الرقمي».</p><p>أنا أفكر.. أنا أحمي.. أنا صديق الأمان الرقمي!</p></div></div><button class="btn" id="re">العب مرة أخرى</button>`;document.getElementById('re').onclick=start}
start();
</script></body></html>
